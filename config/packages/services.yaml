services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    FlexyBundle\Controller\:
        resource: '../../src/Controller'
        tags: ['controller.service_arguments']

    # API controllers
    FlexyBundle\Api\:
        resource: '../../src/Api'
        tags: ['controller.service_arguments']

    # Twig extensions
    FlexyBundle\Twig\CartExtension:
        tags: ['twig.extension']

    FlexyBundle\Twig\CartIsolationExtension:
        tags: ['twig.extension']

    FlexyBundle\Twig\TaxedPriceExtension:
        tags: ['twig.extension']

    FlexyBundle\Twig\HeaderHighlightsExtension:
        tags: ['twig.extension']

    FlexyBundle\Twig\LanguageExtension:
        tags: ['twig.extension']

    # Event subscribers
    FlexyBundle\EventSubscriber\LanguagePersistenceSubscriber:
        tags: ['kernel.event_subscriber']

    # UI Components
    FlexyBundle\UiComponents\LangSelect\LangSelect:
        tags: ['twig.component']
