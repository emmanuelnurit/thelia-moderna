services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Moderna\Controller\:
        resource: '../../src/Controller'
        tags: ['controller.service_arguments']

    # API controllers
    Moderna\Api\:
        resource: '../../src/Api'
        tags: ['controller.service_arguments']

    # Twig extensions
    Moderna\Twig\CartExtension:
        tags: ['twig.extension']

    Moderna\Twig\CartIsolationExtension:
        tags: ['twig.extension']

    Moderna\Twig\TaxedPriceExtension:
        tags: ['twig.extension']

    Moderna\Twig\HeaderHighlightsExtension:
        tags: ['twig.extension']

    Moderna\Twig\LanguageExtension:
        tags: ['twig.extension']

    # Event subscribers
    Moderna\EventSubscriber\LanguagePersistenceSubscriber:
        tags: ['kernel.event_subscriber']

    # UI Components - TwigComponents
    Moderna\UiComponents\LangSelect\LangSelect:
        tags: ['twig.component']

    Moderna\UiComponents\Cart\CartItem:
        tags: ['twig.component']

    # UI Components - LiveComponents
    Moderna\UiComponents\Cart\Cart:
        tags: ['twig.component']

    Moderna\UiComponents\Cart\CartDrawer:
        tags: ['twig.component']

    Moderna\UiComponents\Checkout\PromoCode\PromoCode:
        tags: ['twig.component']

    Moderna\UiComponents\Checkout\AddressForm\AddressForm:
        tags: ['twig.component']

    Moderna\UiComponents\Checkout\Delivery\Delivery:
        tags: ['twig.component']

    Moderna\UiComponents\Checkout\Payment\Payment:
        tags: ['twig.component']

    Moderna\UiComponents\Checkout\Summary\Summary:
        tags: ['twig.component']

    Moderna\UiComponents\Toast\AddToCartToast:
        tags: ['twig.component']

    Moderna\UiComponents\Product\VariantSelector\VariantSelector:
        tags: ['twig.component']

    Moderna\UiComponents\Layout\SearchModal\SearchModal:
        tags: ['twig.component']

    Moderna\UiComponents\Account\AddressList\AddressList:
        tags: ['twig.component']

    Moderna\UiComponents\Account\CustomerUpdate\CustomerUpdate:
        tags: ['twig.component']
